server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Es una SPA: cualquier ruta desconocida la resuelve el router del cliente,
  # así que se devuelve index.html en lugar de un 404 de nginx.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los recursos llevan hash en el nombre, así que se pueden cachear para
  # siempre; el index.html no, o nunca se vería un despliegue nuevo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
